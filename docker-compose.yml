services:
  postgres:
    image: postgres:17-alpine
    container_name: sindy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sindy}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sindy}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sindy-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sindy}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      PORT: 3001
      HOST: 0.0.0.0
    ports:
      - "3001:3001"
    volumes:
      - ./src/database/migrations:/app/src/database/migrations
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm run dev"

volumes:
  postgres_data: