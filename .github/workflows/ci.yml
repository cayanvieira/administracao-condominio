name: CI

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test and validate application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build
        
      - name: Run tests
        run: npm test

      - name: Validate Docker image
        run: docker build -t sindy-ci .